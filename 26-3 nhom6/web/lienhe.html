<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video lớp 12A5</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

/* ===== HEADER ===== */
.header{
    background:#111;
    padding:20px 50px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.menu a:hover{
    opacity:0.7;
}

/* ===== TITLE ===== */
.title{
    text-align:center;
    background:#111;
    color:white;
    padding:40px 0;
    font-size:28px;
}

/* ===== VIDEO SECTION ===== */
.video-section{
    background:white;
    padding:60px 0;
}

.video-container{
    width:90%;
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:30px;
}

/* ===== VIDEO CARD ===== */
.video-card{
    border-radius:20px;
    overflow:hidden;
}

.video-card video{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:20px;
}

/* ===== FOOTER ===== */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    font-weight:bold;
}

/* ===== RESPONSIVE ===== */
@media (max-width:900px){
    .video-container{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media (max-width:600px){
    .video-container{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

    </div>
</div>
